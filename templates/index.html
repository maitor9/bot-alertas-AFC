<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT_ALERTAS_AFP // Terminal Neural</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;600;800&display=swap');

        body {
            background-color: #030706;
            color: #10b981;
            font-family: 'Inter', sans-serif;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
        }

        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }

        .cyber-terminal-card {
            background: linear-gradient(145deg, #06110e, #030807);
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.05), inset 0 1px 1px rgba(16, 185, 129, 0.1);
            transition: all 0.3s ease;
        }

        .cyber-terminal-card:hover {
            border-color: rgba(245, 158, 11, 0.7);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.2), inset 0 1px 2px rgba(245, 158, 11, 0.2);
            transform: translateY(-2px);
        }

        .terminal-btn {
            font-family: 'JetBrains Mono', monospace;
            background: #06110e;
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            transition: all 0.2s ease;
        }

        .terminal-btn:hover, .terminal-btn.active-command {
            background: rgba(16, 185, 129, 0.15);
            border-color: #f59e0b;
            color: #ffb020;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .tab-btn {
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }

        .tab-active {
            background: #f59e0b !important;
            color: #030706 !important;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            border-color: #f59e0b !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030706;
        }
        ::-webkit-scrollbar-thumb {
            background: #065f46;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6">

    <header class="w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center border-b border-emerald-900/50 pb-4 mb-6">
        <div class="flex items-center space-x-3 mb-2 md:mb-0">
            <span class="text-xs font-mono-custom text-amber-400 bg-amber-950/50 px-2.5 py-1 rounded border border-amber-600/30">root@AFC-SYS:~#</span>
            <h1 class="text-xl md:text-2xl font-black tracking-wider font-mono-custom text-emerald-400">
                ./dashboard_neural.sh
            </h1>
        </div>
        <div class="flex items-center gap-4 text-xs font-mono-custom text-emerald-500/80">
            <span class="flex items-center gap-1.5 bg-emerald-950/40 px-3 py-1 rounded border border-emerald-800/40">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                STATUS: ONLINE (24/7)
            </span>
            <span class="hidden sm:inline text-amber-400/80">AFP Analytics</span>
        </div>
    </header>

    <nav class="w-full max-w-7xl mx-auto flex flex-wrap gap-2 mb-6 justify-center">
        <button onclick="cargarDeporte('football_prematch', 'Fútbol')" id="btn-football" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./futbol.sh</button>
        <button onclick="cargarDeporte('nba_prematch', 'NBA & NCAA')" id="btn-nba" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./basket.sh</button>
        <button onclick="cargarDeporte('baseball_prematch', 'Béisbol MLB')" id="btn-baseball" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./mlb.sh</button>
        <button onclick="cargarDeporte('nfl_prematch', 'NFL')" id="btn-nfl" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./nfl.sh</button>
        <button onclick="cargarDeporte('nhl_prematch', 'NHL')" id="btn-nhl" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./nhl.sh</button>
        <button onclick="cargarDeporte('ufc_prematch', 'UFC')" id="btn-ufc" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./ufc.sh</button>
        <button onclick="cargarDeporte('motor_prematch', 'Motor')" id="btn-motor" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider">./motor.sh</button>
        <button onclick="cargarTarjetas()" id="btn-tarjetas" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider border-amber-500/50 text-amber-300">./tarjetas_friction.bin</button>
        <button onclick="cargarParleyOptimo()" id="btn-parley" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider border-blue-500/50 text-blue-300">./parley_optimo_1.50.sh</button>
        <button onclick="cargarHistorialParleys()" id="btn-historial" class="terminal-btn px-3.5 py-2 rounded text-xs font-bold uppercase tracking-wider border-purple-500/50 text-purple-300">./historial_parleys.log</button>
    </nav>

    <div id="sub-tabs" class="w-full max-w-7xl mx-auto flex justify-center gap-3 mb-6">
        <button onclick="cambiarVista('pro')" id="tab-pro" class="tab-btn px-5 py-1.5 rounded text-xs font-bold bg-slate-900 border border-emerald-900/50 text-emerald-400 tab-active">[ MODO_PRO ]</button>
        <button onclick="cambiarVista('vip')" id="tab-vip" class="tab-btn px-5 py-1.5 rounded text-xs font-bold bg-slate-900 border border-emerald-900/50 text-emerald-400 hover:border-amber-500/50">[ MODO_VIP_PICKS ]</button>
    </div>

    <main id="content-container" class="w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    </main>

    <script>
        let currentEndpoint = 'football_prematch';
        let currentSportName = 'Fútbol';
        let currentMode = 'pro';
        let cachedData = null;

        function obtenerEmojiEstado(estado) {
            if (!estado) return '⏳';
            const est = estado.toLowerCase();
            if (est.includes('acertado')) return '✅';
            if (est.includes('fallado') || est.includes('perdido')) return '❌';
            return '⏳';
        }

        async function cargarDeporte(endpoint, sportName) {
            currentEndpoint = endpoint;
            currentSportName = sportName;
            currentMode = 'pro';
            
            document.querySelectorAll('.terminal-btn').forEach(b => b.classList.remove('active-command'));
            const activeBtn = document.getElementById('btn-' + endpoint.replace('_prematch', ''));
            if(activeBtn) {
                activeBtn.classList.add('active-command');
            }

            document.getElementById('sub-tabs').style.display = 'flex';
            cambiarVista('pro');
        }

        async function cargarTarjetas() {
            currentMode = 'tarjetas';
            document.getElementById('sub-tabs').style.display = 'none';
            
            document.querySelectorAll('.terminal-btn').forEach(b => b.classList.remove('active-command'));
            document.getElementById('btn-tarjetas').classList.add('active-command');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-amber-400 font-mono-custom animate-pulse">>>> EJECUTANDO motor neural de fricción y tarjetas nominales...</div>`;

            try {
                const res = await fetch('/api/tarjetas_alerta');
                const json = await res.json();
                
                if(json.status === 'success' && json.alertas.length > 0) {
                    renderizarTarjetas(json.alertas);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-emerald-500/70 cyber-terminal-card rounded-xl p-8 font-mono-custom">[INFO] No hay alertas de fricción activas en este buffer neural.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-terminal-card rounded-xl p-8 font-mono-custom">[ERROR] Fallo al procesar el stream neural de tarjetas.</div>`;
            }
        }

        async function cargarParleyOptimo() {
            currentMode = 'parley_optimo';
            document.getElementById('sub-tabs').style.display = 'none';

            document.querySelectorAll('.terminal-btn').forEach(b => b.classList.remove('active-command'));
            document.getElementById('btn-parley').classList.add('active-command');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-blue-400 font-mono-custom animate-pulse">>>> CALCULANDO combinatoria neural de alta probabilidad (Target: Cuota 1.50+)...</div>`;

            try {
                const res = await fetch('/api/parley_optimo');
                const json = await res.json();

                if(json.status === 'success' && json.picks.length > 0) {
                    renderizarParleyOptimo(json);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-emerald-500/70 cyber-terminal-card rounded-xl p-8 font-mono-custom">[INFO] No hay suficientes datos neurales para generar el parley óptimo.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-terminal-card rounded-xl p-8 font-mono-custom">[ERROR] Fallo al conectar con el núcleo neural de combinadas.</div>`;
            }
        }

        async function cargarHistorialParleys() {
            currentMode = 'historial_parleys';
            document.getElementById('sub-tabs').style.display = 'none';

            document.querySelectorAll('.terminal-btn').forEach(b => b.classList.remove('active-command'));
            document.getElementById('btn-historial').classList.add('active-command');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-purple-400 font-mono-custom animate-pulse">>>> LEYENDO registros de auditoría neural e historial...</div>`;

            try {
                const res = await fetch('/api/historial_parleys');
                const json = await res.json();

                if(json.status === 'success' && json.historial.length > 0) {
                    renderizarHistorialParleys(json.historial);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-emerald-500/70 cyber-terminal-card rounded-xl p-8 font-mono-custom">[INFO] El registro neural está vacío. Genera al menos un parley.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-terminal-card rounded-xl p-8 font-mono-custom">[ERROR] Fallo al recuperar la base de datos de auditoría neural.</div>`;
            }
        }

        async function cambiarVista(modo) {
            currentMode = modo;
            document.getElementById('tab-pro').classList.toggle('tab-active', modo === 'pro');
            document.getElementById('tab-vip').classList.toggle('tab-active', modo === 'vip');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-emerald-400 font-mono-custom animate-pulse">>>> CARGANDO vectores neurales para ${currentSportName}...</div>`;

            try {
                const res = await fetch(`/api/${currentEndpoint}`);
                cachedData = await res.json();
                renderizarDatos();
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-terminal-card rounded-xl p-8 font-mono-custom">[ERROR] No se pudo sincronizar con el backend Flask.</div>`;
            }
        }

        function renderizarDatos() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (!cachedData) return;

            let itemsToRender = [];
            if (currentMode === 'pro') {
                itemsToRender = cachedData.data || [];
            } else {
                itemsToRender = cachedData.picks_vip || [];
            }

            if (itemsToRender.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-emerald-500/70 cyber-terminal-card rounded-xl p-8 font-mono-custom">[INFO] Buffer neural vacío para este sector.</div>`;
                return;
            }

            itemsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = "cyber-terminal-card rounded-xl p-5 flex flex-col justify-between relative overflow-hidden";
                
                let formattedHtml = "";
                if (currentMode === 'pro') {
                    let text = item.mensaje || '';
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-400 font-mono-custom">$1</strong>');
                    text = text.replace(/\*(.*?)\*/g, '<span class="text-emerald-600 font-mono-custom text-xs">$1</span>');
                    formattedHtml = `<div class="text-xs md:text-sm space-y-2 whitespace-pre-line text-emerald-300 font-mono-custom">${text}</div>`;
                } else {
                    const estadoRaw = item.estado_pick || 'pendiente';
                    const emojiEstado = obtenerEmojiEstado(estadoRaw);
                    formattedHtml = `
                        <div>
                            <span class="text-[10px] font-mono-custom uppercase tracking-wider text-amber-400 bg-amber-950/40 px-2 py-0.5 rounded border border-amber-600/30">${item.liga || currentSportName}</span>
                            <h3 class="text-base font-bold font-mono-custom text-white mt-2 mb-3">${item.partido}</h3>
                            <div class="bg-black/60 rounded-lg p-3 border border-emerald-900/60 mb-4">
                                <span class="text-[10px] font-mono-custom text-emerald-500 block mb-0.5">[NEURAL_TARGET]:</span>
                                <span class="text-xs font-mono-custom font-bold text-amber-300">${item.mercado}</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-3 border-t border-emerald-900/40 text-xs font-mono-custom">
                            <span class="text-emerald-500">PROB: <strong class="text-emerald-300">${item.prob}%</strong></span>
                            <span class="text-emerald-500 flex items-center gap-1.5">STATUS: <span class="text-base">${emojiEstado}</span></span>
                        </div>
                    `;
                }

                card.innerHTML = formattedHtml;
                container.appendChild(card);
            });
        }

        function renderizarTarjetas(alertas) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            alertas.forEach(alerta => {
                const card = document.createElement('div');
                card.className = "cyber-terminal-card rounded-xl p-5 flex flex-col justify-between border-amber-500/40";
                
                let text = alerta.mensaje || '';
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-300 font-mono-custom">$1</strong>');
                text = text.replace(/\*(.*?)\*/g, '<span class="text-emerald-600 font-mono-custom text-xs">$1</span>');

                card.innerHTML = `
                    <div class="text-xs md:text-sm space-y-2 whitespace-pre-line text-emerald-300 font-mono-custom">${text}</div>
                    <div class="mt-4 pt-3 border-t border-amber-900/40 flex justify-between items-center text-xs font-mono-custom">
                        <span class="text-amber-400 font-bold">[FRICCIÓN_NEURAL]</span>
                        <span class="text-emerald-400">⏳ ${alerta.fecha}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarParleyOptimo(data) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            const headerCard = document.createElement('div');
            headerCard.className = "cyber-terminal-card col-span-full rounded-xl p-6 border-amber-500/50 flex flex-col md:flex-row justify-between items-center gap-4 mb-2";
            headerCard.innerHTML = `
                <div>
                    <span class="text-xs font-mono-custom text-amber-400 bg-amber-950/50 px-2 py-1 rounded border border-amber-600/30">[PARLEY_NEURAL_RECOMENDADO]</span>
                    <h2 class="text-lg font-bold font-mono-custom text-white mt-2">Combinada de Fútbol (Alta Probabilidad)</h2>
                    <p class="text-xs text-emerald-400 font-mono-custom mt-1">Validador de cuotas The Odds API • Target mínimo: 1.50</p>
                </div>
                <div class="text-right font-mono-custom">
                    <span class="text-xs text-slate-400 block">CUOTA TOTAL ACUMULADA:</span>
                    <span class="text-2xl font-black text-amber-300">${data.cuota_total}</span>
                </div>
            `;
            container.appendChild(headerCard);

            data.picks.forEach((pick, index) => {
                const card = document.createElement('div');
                card.className = "cyber-terminal-card rounded-xl p-5 flex flex-col justify-between border-emerald-500/30";
                card.innerHTML = `
                    <div>
                        <span class="text-[10px] font-mono-custom uppercase tracking-wider text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-800/30">SELECCIÓN NEURAL #${index + 1}</span>
                        <h3 class="text-base font-bold font-mono-custom text-white mt-2 mb-3">${pick.partido}</h3>
                        <div class="bg-black/60 rounded-lg p-3 border border-emerald-900/60 mb-4 space-y-1 font-mono-custom text-xs">
                            <span class="text-slate-400 block">MERCADO: <strong class="text-amber-300">${pick.mercado}</strong></span>
                            <div class="flex justify-between pt-1 border-t border-emerald-950">
                                <span class="text-slate-400">PROBABILIDAD: <strong class="text-emerald-300">${pick.prob}%</strong></span>
                                <span class="text-slate-400">CUOTA: <strong class="text-blue-300 font-bold">${pick.cuota}</strong></span>
                            </div>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-emerald-900/40 flex justify-between items-center text-xs font-mono-custom">
                        <span class="text-emerald-500">ESTADO:</span>
                        <span class="text-base">⏳ (Guardado en Auditoría Neural)</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarHistorialParleys(historial) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            const headerCard = document.createElement('div');
            headerCard.className = "cyber-terminal-card col-span-full rounded-xl p-6 border-purple-500/50 flex flex-col md:flex-row justify-between items-center gap-4 mb-2";
            headerCard.innerHTML = `
                <div>
                    <span class="text-xs font-mono-custom text-purple-400 bg-purple-950/50 px-2 py-1 rounded border border-purple-600/30">[AUDITORÍA_NEURAL]</span>
                    <h2 class="text-lg font-bold font-mono-custom text-white mt-2">Historial de Parleys Registrados</h2>
                    <p class="text-xs text-purple-300/80 font-mono-custom mt-1">Base de datos de persistencia neural semanal / diaria</p>
                </div>
                <div class="text-right font-mono-custom">
                    <span class="text-xs text-slate-400 block">TOTAL REGISTROS:</span>
                    <span class="text-xl font-black text-purple-300">${historial.length} Parleys</span>
                </div>
            `;
            container.appendChild(headerCard);

            historial.forEach(item => {
                const card = document.createElement('div');
                card.className = "cyber-terminal-card col-span-full rounded-xl p-5 border-purple-500/30";
                
                let picksHtml = item.picks.map((p, idx) => `
                    <div class="flex justify-between text-xs font-mono-custom border-b border-purple-950 py-1.5">
                        <span class="text-slate-300">#${idx + 1} - ${p.partido} (${p.mercado})</span>
                        <span class="text-amber-300 font-bold">Cuota: ${p.cuota}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-purple-900/40 pb-3 mb-3">
                        <div>
                            <span class="text-[10px] font-mono-custom text-purple-400 bg-purple-950/40 px-2 py-0.5 rounded">REGISTRO NEURAL #${item.id}</span>
                            <span class="text-xs text-slate-400 ml-2">📅 ${item.fecha}</span>
                        </div>
                        <div class="mt-2 md:mt-0 font-mono-custom text-xs">
                            <span class="text-slate-400 mr-2">Cuota Total: <strong class="text-amber-300 text-sm">${item.cuota_total}</strong></span>
                            <span class="text-slate-400">Estado: <strong class="text-blue-400 uppercase">${item.estado}</strong></span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        ${picksHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => cargarDeporte('football_prematch', 'Fútbol');
    </script>
</body>
</html>
