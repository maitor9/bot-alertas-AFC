<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Alertas AFC - Panel Cuantitativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cyber-card {
            background: linear-gradient(145deg, #131b2e, #0f172a);
            border: 1px solid #1e293b;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .cyber-card:hover {
            transform: translateY(-3px);
            border-color: #d4af37;
        }
        .tab-btn {
            transition: all 0.3s ease;
        }
        .tab-active {
            background: linear-gradient(135deg, #d4af37, #b8860b) !important;
            color: #0b0f19 !important;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="text-center mb-8">
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 mb-2">
            Rastreo y Proyecciones Sabermétricas
        </h1>
        <p class="text-xs md:text-sm text-slate-400 uppercase tracking-widest">Modelos Cuantitativos AFP</p>
    </header>

    <nav class="flex flex-wrap justify-center gap-2 mb-6 max-w-5xl">
        <button onclick="cargarDeporte('football_prematch', 'Fútbol')" id="btn-football" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">⚽ Fútbol</button>
        <button onclick="cargarDeporte('nba_prematch', 'NBA & NCAA')" id="btn-nba" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">🏀 Basket</button>
        <button onclick="cargarDeporte('baseball_prematch', 'Béisbol MLB')" id="btn-baseball" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">⚾ Béisbol</button>
        <button onclick="cargarDeporte('nfl_prematch', 'NFL')" id="btn-nfl" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">🏈 NFL</button>
        <button onclick="cargarDeporte('nhl_prematch', 'NHL')" id="btn-nhl" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">🏒 NHL</button>
        <button onclick="cargarDeporte('ufc_prematch', 'UFC')" id="btn-ufc" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">🥊 UFC</button>
        <button onclick="cargarDeporte('motor_prematch', 'Motor')" id="btn-motor" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">🏎️ Motor</button>
        <button onclick="cargarTarjetas()" id="btn-tarjetas" class="sport-btn px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-amber-950/60 text-amber-300 hover:bg-amber-900/60 border border-amber-600/50">Picks Tarjetas 🟨</button>
    </nav>

    <div id="sub-tabs" class="flex justify-center gap-4 mb-8">
        <button onclick="cambiarVista('pro')" id="tab-pro" class="tab-btn px-6 py-2 rounded-full text-xs md:text-sm font-medium bg-slate-900 border border-slate-700 text-slate-300 tab-active">Partidos PRO</button>
        <button onclick="cambiarVista('vip')" id="tab-vip" class="tab-btn px-6 py-2 rounded-full text-xs md:text-sm font-medium bg-slate-900 border border-slate-700 text-slate-300">Picks VIP</button>
    </div>

    <main id="content-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-7xl">
    </main>

    <script>
        let currentEndpoint = 'football_prematch';
        let currentSportName = 'Fútbol';
        let currentMode = 'pro';
        let cachedData = null;

        function obtenerEmojiEstado(estado) {
            if (!estado) return '⏳';
            const est = estado.toLowerCase();
            if (est.includes('acertado')) return '✅';
            if (est.includes('fallado') || est.includes('perdido')) return '❌';
            return '⏳';
        }

        async function cargarDeporte(endpoint, sportName) {
            currentEndpoint = endpoint;
            currentSportName = sportName;
            currentMode = 'pro';
            
            document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-400'));
            const activeBtn = document.getElementById('btn-' + endpoint.replace('_prematch', ''));
            if(activeBtn) activeBtn.classList.add('ring-2', 'ring-amber-400');

            document.getElementById('sub-tabs').style.display = 'flex';
            cambiarVista('pro');
        }

        async function cargarTarjetas() {
            currentMode = 'tarjetas';
            document.getElementById('sub-tabs').style.display = 'none';
            
            document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-400'));
            document.getElementById('btn-tarjetas').classList.add('ring-2', 'ring-amber-400');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 animate-pulse">⚡ Analizando fricción y duelos calientes...</div>`;

            try {
                const res = await fetch('/api/tarjetas_alerta');
                const json = await res.json();
                
                if(json.status === 'success' && json.alertas.length > 0) {
                    renderizarTarjetas(json.alertas);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 cyber-card rounded-2xl p-8">ℹ️ No hay alertas de fricción activas en este momento.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400 cyber-card rounded-2xl p-8">⚠️ Error al conectar con el motor de tarjetas.</div>`;
            }
        }

        async function cambiarVista(modo) {
            currentMode = modo;
            document.getElementById('tab-pro').classList.toggle('tab-active', modo === 'pro');
            document.getElementById('tab-vip').classList.toggle('tab-active', modo === 'vip');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 animate-pulse">Cargando modelos para ${currentSportName}...</div>`;

            try {
                const res = await fetch(`/api/${currentEndpoint}`);
                cachedData = await res.json();
                renderizarDatos();
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400 cyber-card rounded-2xl p-8">⚠️ Error al cargar los datos del servidor.</div>`;
            }
        }

        function renderizarDatos() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (!cachedData) return;

            let itemsToRender = [];
            if (currentMode === 'pro') {
                itemsToRender = cachedData.data || [];
            } else {
                itemsToRender = cachedData.picks_vip || [];
            }

            if (itemsToRender.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 cyber-card rounded-2xl p-8">ℹ️ No hay proyecciones disponibles para esta categoría en este momento.</div>`;
                return;
            }

            itemsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = "cyber-card rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden";
                
                let formattedHtml = "";
                if (currentMode === 'pro') {
                    let text = item.mensaje || '';
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-300">$1</strong>');
                    text = text.replace(/\*(.*?)\*/g, '<span class="text-slate-400 italic text-xs">$1</span>');
                    formattedHtml = `<div class="text-sm space-y-2 whitespace-pre-line text-slate-200">${text}</div>`;
                } else {
                    const estadoRaw = item.estado_pick || 'pendiente';
                    const emojiEstado = obtenerEmojiEstado(estadoRaw);
                    formattedHtml = `
                        <div>
                            <span class="text-xs uppercase tracking-wider text-amber-400 font-semibold">${item.liga || currentSportName}</span>
                            <h3 class="text-lg font-bold text-white mt-1 mb-2">${item.partido}</h3>
                            <div class="bg-slate-900/80 rounded-xl p-3 border border-amber-500/20 mb-3">
                                <span class="text-xs text-slate-400 block">Mercado Sugerido:</span>
                                <span class="text-sm font-bold text-amber-200">${item.mercado}</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-800 text-xs">
                            <span class="text-slate-400">Probabilidad: <strong class="text-emerald-400">${item.prob}%</strong></span>
                            <span class="text-slate-400">Estado: <span class="text-base">${emojiEstado}</span></span>
                        </div>
                    `;
                }

                card.innerHTML = formattedHtml;
                container.appendChild(card);
            });
        }

        function renderizarTarjetas(alertas) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            alertas.forEach(alerta => {
                const card = document.createElement('div');
                card.className = "cyber-card rounded-2xl p-6 flex flex-col justify-between border-amber-500/30";
                
                let text = alerta.mensaje || '';
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-300">$1</strong>');
                text = text.replace(/\*(.*?)\*/g, '<span class="text-slate-400 italic text-xs">$1</span>');

                card.innerHTML = `
                    <div class="text-sm space-y-2 whitespace-pre-line text-slate-200">${text}</div>
                    <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                        <span class="text-amber-400 font-semibold">🟨 Mercado de Fricción</span>
                        <span class="text-slate-400">⏳ ${alerta.fecha}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => cargarDeporte('football_prematch', 'Fútbol');
    </script>
</body>
</html>
