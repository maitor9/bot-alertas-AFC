<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Alertas AFC - Panel Cuantitativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #070913;
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(59, 130, 246, 0.06) 0%, transparent 40%);
            min-height: 100vh;
        }
        .cyber-card {
            background: linear-gradient(145deg, #0e1628, #090e1a);
            border: 1px solid rgba(30, 41, 59, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 55, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cyber-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.15), inset 0 1px 2px rgba(212, 175, 55, 0.2);
        }
        .cyber-card-blue:hover {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15), inset 0 1px 2px rgba(59, 130, 246, 0.2);
        }
        .tab-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-active {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            color: #070913 !important;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.3);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
        }
        /* Scrollbar personalizado neón */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #070913;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- CABECERA NEÓN -->
    <header class="text-center mb-8 relative">
        <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-64 h-24 bg-amber-500/10 blur-3xl pointer-events-none rounded-full"></div>
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-100 to-amber-500 mb-2 glow-text">
            Rastreo y Proyecciones Sabermétricas
        </h1>
        <p class="text-xs md:text-sm text-slate-400 uppercase tracking-widest font-semibold flex items-center justify-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Modelos Cuantitativos AFP • Clan Smash Burgers Analytics
        </p>
    </header>

    <!-- NAVEGACIÓN PRINCIPAL DE DEPORTES Y MÓDULOS -->
    <nav class="flex flex-wrap justify-center gap-2 mb-6 max-w-6xl">
        <button onclick="cargarDeporte('football_prematch', 'Fútbol')" id="btn-football" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">⚽ Fútbol</button>
        <button onclick="cargarDeporte('nba_prematch', 'NBA & NCAA')" id="btn-nba" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">🏀 Basket</button>
        <button onclick="cargarDeporte('baseball_prematch', 'Béisbol MLB')" id="btn-baseball" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">⚾ Béisbol</button>
        <button onclick="cargarDeporte('nfl_prematch', 'NFL')" id="btn-nfl" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">🏈 NFL</button>
        <button onclick="cargarDeporte('nhl_prematch', 'NHL')" id="btn-nhl" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">🏒 NHL</button>
        <button onclick="cargarDeporte('ufc_prematch', 'UFC')" id="btn-ufc" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">🥊 UFC</button>
        <button onclick="cargarDeporte('motor_prematch', 'Motor')" id="btn-motor" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-slate-900/90 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700/80 shadow-lg">🏎️ Motor</button>
        <button onclick="cargarTarjetas()" id="btn-tarjetas" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-amber-950/80 text-amber-300 hover:bg-amber-900 border border-amber-500/50 shadow-lg shadow-amber-950/40">Picks Tarjetas 🟨</button>
        <button onclick="cargarLineMovement()" id="btn-line" class="sport-btn px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold bg-blue-950/80 text-blue-300 hover:bg-blue-900 border border-blue-500/50 shadow-lg shadow-blue-950/40">📊 Cuotas CLV</button>
    </nav>

    <!-- SUB-PESTAÑAS (PRO vs VIP) -->
    <div id="sub-tabs" class="flex justify-center gap-3 mb-8">
        <button onclick="cambiarVista('pro')" id="tab-pro" class="tab-btn px-6 py-2 rounded-full text-xs md:text-sm font-semibold bg-slate-900 border border-slate-700 text-slate-300 tab-active">Partidos PRO</button>
        <button onclick="cambiarVista('vip')" id="tab-vip" class="tab-btn px-6 py-2 rounded-full text-xs md:text-sm font-semibold bg-slate-900 border border-slate-700 text-slate-300 hover:border-amber-500/50">Picks VIP</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE TARJETAS -->
    <main id="content-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-7xl">
        <!-- Inyección dinámica -->
    </main>

    <!-- SCRIPT DE CONTROL Y RENDERIZADO -->
    <script>
        let currentEndpoint = 'football_prematch';
        let currentSportName = 'Fútbol';
        let currentMode = 'pro';
        let cachedData = null;

        function obtenerEmojiEstado(estado) {
            if (!estado) return '⏳';
            const est = estado.toLowerCase();
            if (est.includes('acertado')) return '✅';
            if (est.includes('fallado') || est.includes('perdido')) return '❌';
            return '⏳';
        }

        async function cargarDeporte(endpoint, sportName) {
            currentEndpoint = endpoint;
            currentSportName = sportName;
            currentMode = 'pro';
            
            document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-400', 'ring-blue-400', 'scale-105'));
            const activeBtn = document.getElementById('btn-' + endpoint.replace('_prematch', ''));
            if(activeBtn) {
                activeBtn.classList.add('ring-2', 'ring-amber-400', 'scale-105');
            }

            document.getElementById('sub-tabs').style.display = 'flex';
            cambiarVista('pro');
        }

        async function cargarTarjetas() {
            currentMode = 'tarjetas';
            document.getElementById('sub-tabs').style.display = 'none';
            
            document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-400', 'ring-blue-400', 'scale-105'));
            document.getElementById('btn-tarjetas').classList.add('ring-2', 'ring-amber-400', 'scale-105');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-amber-400 font-semibold animate-pulse tracking-wider">⚡ Escaneando plantillas y calculando coeficientes de fricción...</div>`;

            try {
                const res = await fetch('/api/tarjetas_alerta');
                const json = await res.json();
                
                if(json.status === 'success' && json.alertas.length > 0) {
                    renderizarTarjetas(json.alertas);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 cyber-card rounded-2xl p-8">ℹ️ No hay alertas de fricción activas en este momento.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-card rounded-2xl p-8 border-rose-500/30">⚠️ Error al conectar con el motor cuantitativo de tarjetas.</div>`;
            }
        }

        async function cargarLineMovement() {
            currentMode = 'line_movement';
            document.getElementById('sub-tabs').style.display = 'none';

            document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-400', 'ring-blue-400', 'scale-105'));
            document.getElementById('btn-line').classList.add('ring-2', 'ring-blue-400', 'scale-105');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-blue-400 font-semibold animate-pulse tracking-wider">📊 Consultando evolución de líneas CLV en tiempo real...</div>`;

            try {
                const res = await fetch('/api/line_movement');
                const json = await res.json();

                if(json.status === 'success' && json.movimientos.length > 0) {
                    renderizarLineMovement(json.movimientos);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 cyber-card rounded-2xl p-8">ℹ️ No hay registros de movimiento de cuotas disponibles en este momento.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-card rounded-2xl p-8 border-rose-500/30">⚠️ Error al conectar con The Odds API.</div>`;
            }
        }

        async function cambiarVista(modo) {
            currentMode = modo;
            document.getElementById('tab-pro').classList.toggle('tab-active', modo === 'pro');
            document.getElementById('tab-vip').classList.toggle('tab-active', modo === 'vip');

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 animate-pulse tracking-wide">Cargando modelos analíticos para ${currentSportName}...</div>`;

            try {
                const res = await fetch(`/api/${currentEndpoint}`);
                cachedData = await res.json();
                renderizarDatos();
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400 cyber-card rounded-2xl p-8 border-rose-500/30">⚠️ Error al cargar los datos del servidor.</div>`;
            }
        }

        function renderizarDatos() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (!cachedData) return;

            let itemsToRender = [];
            if (currentMode === 'pro') {
                itemsToRender = cachedData.data || [];
            } else {
                itemsToRender = cachedData.picks_vip || [];
            }

            if (itemsToRender.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 cyber-card rounded-2xl p-8">ℹ️ No hay proyecciones disponibles para esta categoría en este momento.</div>`;
                return;
            }

            itemsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = "cyber-card rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden";
                
                let formattedHtml = "";
                if (currentMode === 'pro') {
                    let text = item.mensaje || '';
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-300">$1</strong>');
                    text = text.replace(/\*(.*?)\*/g, '<span class="text-slate-400 italic text-xs">$1</span>');
                    formattedHtml = `<div class="text-sm space-y-2 whitespace-pre-line text-slate-300">${text}</div>`;
                } else {
                    const estadoRaw = item.estado_pick || 'pendiente';
                    const emojiEstado = obtenerEmojiEstado(estadoRaw);
                    formattedHtml = `
                        <div>
                            <span class="text-xs uppercase tracking-wider text-amber-400 font-extrabold">${item.liga || currentSportName}</span>
                            <h3 class="text-lg font-bold text-white mt-1 mb-3">${item.partido}</h3>
                            <div class="bg-slate-950/80 rounded-xl p-3 border border-amber-500/20 mb-4 shadow-inner">
                                <span class="text-xs text-slate-400 block mb-1">Mercado Sugerido:</span>
                                <span class="text-sm font-bold text-amber-200 tracking-wide">${item.mercado}</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-3 border-t border-slate-800/80 text-xs">
                            <span class="text-slate-400">Probabilidad: <strong class="text-emerald-400 font-bold">${item.prob}%</strong></span>
                            <span class="text-slate-400 flex items-center gap-1.5">Estado: <span class="text-base">${emojiEstado}</span></span>
                        </div>
                    `;
                }

                card.innerHTML = formattedHtml;
                container.appendChild(card);
            });
        }

        function renderizarTarjetas(alertas) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            alertas.forEach(alerta => {
                const card = document.createElement('div');
                card.className = "cyber-card rounded-2xl p-6 flex flex-col justify-between border-amber-500/30 shadow-amber-950/20";
                
                let text = alerta.mensaje || '';
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-300">$1</strong>');
                text = text.replace(/\*(.*?)\*/g, '<span class="text-slate-400 italic text-xs">$1</span>');

                card.innerHTML = `
                    <div class="text-sm space-y-2 whitespace-pre-line text-slate-300">${text}</div>
                    <div class="mt-4 pt-3 border-t border-slate-800/80 flex justify-between items-center text-xs">
                        <span class="text-amber-400 font-bold flex items-center gap-1">🟨 Mercado de Fricción</span>
                        <span class="text-slate-400 font-medium">⏳ ${alerta.fecha}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarLineMovement(movimientos) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            movimientos.forEach(mov => {
                const card = document.createElement('div');
                card.className = "cyber-card cyber-card-blue rounded-2xl p-6 flex flex-col justify-between border-blue-500/30 shadow-blue-950/20";
                
                const colorVariacion = mov.variacion_pct < 0 ? 'text-emerald-400' : (mov.variacion_pct > 0 ? 'text-rose-400' : 'text-slate-300');

                card.innerHTML = `
                    <div>
                        <span class="text-xs uppercase tracking-wider text-blue-400 font-extrabold flex items-center gap-1">📊 Tracking de Línea (CLV)</span>
                        <h3 class="text-lg font-bold text-white mt-1 mb-3">${mov.partido}</h3>
                        <div class="bg-slate-950/80 rounded-xl p-3 border border-blue-500/20 mb-4 space-y-2 shadow-inner">
                            <span class="text-xs text-slate-400 block">Mercado: <strong class="text-slate-200">${mov.mercado}</strong></span>
                            <div class="flex justify-between text-xs pt-1 border-t border-slate-900">
                                <span class="text-slate-400">Apertura: <strong class="text-slate-300 font-mono">${mov.cuota_apertura}</strong></span>
                                <span class="text-slate-400">Actual: <strong class="text-blue-300 font-mono">${mov.cuota_actual}</strong></span>
                            </div>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-800/80 flex justify-between items-center text-xs">
                        <span class="text-slate-400">Variación: <strong class="${colorVariacion} font-bold font-mono">${mov.variacion_pct}%</strong></span>
                        <span class="font-bold text-slate-200 bg-slate-900 px-2.5 py-1 rounded-md border border-slate-800">${mov.tendencia}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => cargarDeporte('football_prematch', 'Fútbol');
    </script>
</body>
</html>
