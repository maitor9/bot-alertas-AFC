<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFC Analytics - AI Cyber Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030508;
            --card-bg: rgba(10, 14, 23, 0.85);
            --card-border: rgba(245, 158, 11, 0.18);
            --accent-gold: #f59e0b;
            --accent-orange: #f97316;
            --accent-blue: #3b82f6;
            --accent-nfl: #10b981;
            --accent-nhl: #38bdf8;
            --accent-ufc: #ef4444;
            --accent-motor: #a855f7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.07) 0%, transparent 35%),
                linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-primary);
            margin: 0; padding: 0; min-height: 100vh;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 6%; background: rgba(3, 5, 8, 0.95);
            backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border);
            position: sticky; top: 0; z-index: 100;
        }

        .brand { 
            display: flex; align-items: center; gap: 14px; 
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 22px; 
            letter-spacing: 1px; color: #fff;
        }
        
        .sport-selector { display: flex; gap: 6px; flex-wrap: wrap; }
        .sport-btn {
            background: rgba(10, 14, 23, 0.8); border: 1px solid var(--card-border);
            color: var(--text-secondary); padding: 8px 12px; border-radius: 12px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px;
        }
        .sport-btn.active-fut { background: linear-gradient(135deg, var(--accent-gold) 0%, #b45309 100%); color: #000 !important; border-color: var(--accent-gold); box-shadow: 0 4px 18px rgba(245, 158, 11, 0.4); }
        .sport-btn.active-bas { background: linear-gradient(135deg, var(--accent-orange) 0%, #c2410c 100%); color: #000 !important; border-color: var(--accent-orange); box-shadow: 0 4px 18px rgba(249, 115, 22, 0.4); }
        .sport-btn.active-mlb { background: linear-gradient(135deg, var(--accent-blue) 0%, #1e3a8a 100%); color: #fff !important; border-color: var(--accent-blue); box-shadow: 0 4px 18px rgba(59, 130, 246, 0.4); }
        .sport-btn.active-nfl { background: linear-gradient(135deg, var(--accent-nfl) 0%, #047857 100%); color: #000 !important; border-color: var(--accent-nfl); box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4); }
        .sport-btn.active-nhl { background: linear-gradient(135deg, var(--accent-nhl) 0%, #0369a1 100%); color: #000 !important; border-color: var(--accent-nhl); box-shadow: 0 4px 18px rgba(56, 189, 248, 0.4); }
        .sport-btn.active-ufc { background: linear-gradient(135deg, var(--accent-ufc) 0%, #7f1d1d 100%); color: #fff !important; border-color: var(--accent-ufc); box-shadow: 0 4px 18px rgba(239, 68, 68, 0.4); }
        .sport-btn.active-motor { background: linear-gradient(135deg, var(--accent-motor) 0%, #581c87 100%); color: #fff !important; border-color: var(--accent-motor); box-shadow: 0 4px 18px rgba(168, 85, 247, 0.4); }

        .hero-section { max-width: 1240px; margin: 40px auto; padding: 0 24px; text-align: center; }
        .hero-title { font-family: 'Orbitron', sans-serif; font-size: 35px; font-weight: 900; line-height: 1.2; margin: 0 0 15px 0; }
        
        .main-container { max-width: 1240px; margin: 30px auto; padding: 0 24px; }
        .tabs-nav { display: flex; gap: 14px; margin-bottom: 30px; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; flex-wrap: wrap; justify-content: center; }
